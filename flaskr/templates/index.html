<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie Recommender System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Rajdhani', 'sans-serif'],
                        body: ['"Share Tech Mono"', 'monospace'],
                    },
                    colors: {
                        neonPink: '#a3786a',
                        neonCyan: '#9ab3c0',
                        neonGreen: '#93a784',
                        cyberBlack: '#1a1f28',
                        cyberGray: '#242c38',
                        tokenSurface: '#1f2631',
                        tokenPanel: '#293444',
                        tokenBorder: '#8fa7b5',
                        tokenText: '#e6e8ea',
                        tokenMuted: '#b2b7bf',
                        tokenAlert: '#b07a6d',
                    },
                    boxShadow: {
                        tokenGlow: '0 0 0 1px rgba(143,167,181,0.35), 0 14px 30px rgba(0,0,0,0.45)',
                        tokenNeon: '0 0 14px rgba(143,167,181,0.28)',
                    },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .cyber-glitch:hover {
            text-shadow: 1px 0 rgba(163, 120, 106, 0.65), -1px 0 rgba(154, 179, 192, 0.65);
        }
    </style>
</head>
<body class="{% if ui_variant == 'v2' %}bg-cyberBlack font-body text-neonCyan v2-shell{% endif %}">
<div id="app">
    <template v-if="isLoading">
        <section class="hero is-fullheight">
            <div class="hero-body">
                <div class="">
                    <p class="title">
                        Loading...
                    </p>
                </div>
            </div>
        </section>
    </template>
    <template v-else>
        <div class="container">
            <nav :class="['navbar', 'is-active', {% if ui_variant == 'v2' %}'bg-cyberBlack border-b border-neonPink shadow-[0_5px_20px_rgba(163,120,106,0.22)]'{% endif %}]" role="navigation" aria-label="main navigation">
                <div class="navbar-brand">
                    <a class="navbar-item" href="/">
                        <span class="is-size-3 {% if ui_variant == 'v2' %}font-display font-bold text-neonCyan tracking-[0.2em] uppercase cyber-glitch{% endif %}">{% if ui_variant == 'v2' %}Studio Recommender{% else %}Movies Recommender System{% endif %}</span>
                    </a>

                    <a role="button" :class="['navbar-burger', isActivityNavBar ? 'is-active' : '']" aria-label="menu"
                       aria-expanded="false"
                       data-target="navbarBasicExample" @click="isActivityNavBar = !isActivityNavBar">
                        <span aria-hidden="true" class="{% if ui_variant == 'v2' %}text-neonPink{% endif %}"></span>
                        <span aria-hidden="true" class="{% if ui_variant == 'v2' %}text-neonPink{% endif %}"></span>
                        <span aria-hidden="true" class="{% if ui_variant == 'v2' %}text-neonPink{% endif %}"></span>
                    </a>
                </div>

                <div id="navbarBasicExample" :class="['navbar-menu', isActivityNavBar ? 'is-active' : '', {% if ui_variant == 'v2' %}isActivityNavBar ? 'bg-cyberBlack' : 'bg-transparent'{% endif %}]">
                    <div class="navbar-start">
                    </div>
                    <div class="navbar-end">
                        <div class="navbar-item">
                            <div class="buttons {% if ui_variant == 'v2' %}v2-nav-actions{% endif %}">
                                {% if ui_variant == 'v2' %}
                                <span class="button is-small is-static bg-transparent border border-neonPink text-neonPink font-body uppercase tracking-wider v2-nav-pill" title="A/B algorithm group">Algorithm {{ ab_variant }}</span>
                                {% if participant_id %}
                                <span class="tag is-dark border border-neonCyan text-neonCyan bg-transparent">ID: {{ participant_id }}</span>
                                {% endif %}
                                <button class="button is-small bg-transparent border border-neonCyan text-neonCyan hover:bg-neonCyan hover:text-black font-body uppercase tracking-wider v2-nav-pill" @click="scrollToSection('preference-dashboard')">
                                    <strong>DASHBOARD</strong>
                                </button>
                                <button class="button is-small bg-transparent border border-neonCyan text-neonCyan hover:bg-neonCyan hover:text-black font-body uppercase tracking-wider v2-nav-pill" @click="scrollToSection('feedback-loop')">
                                    <strong>FEEDBACK LOOP</strong>
                                </button>
                                <button class="button is-small bg-transparent border border-neonPink text-neonPink hover:bg-neonPink hover:text-black font-body uppercase tracking-wider v2-nav-pill" @click="toggleControlPanel">
                                    <strong>[[ isControlPanelOpen ? 'CLOSE CONTROLS' : 'RECOMMENDATION CONTROLS' ]]</strong>
                                </button>
                                <a class="button is-small bg-transparent border border-neonCyan text-neonCyan hover:bg-neonCyan hover:text-black font-body uppercase tracking-wider" href="/?variant={{ ab_variant }}{% if participant_id %}&participant_id={{ participant_id }}{% endif %}&ui=classic">
                                    <strong>Original UI</strong>
                                </a>
                                {% else %}
                                <a class="button is-primary is-light" href="/?variant={{ ab_variant }}{% if participant_id %}&participant_id={{ participant_id }}{% endif %}&ui=v2">
                                    <strong>Studio UI</strong>
                                </a>
                                <button class="button is-danger" @click="cleanAll">
                                    <strong>{% if ui_variant == 'v2' %}CLEAR DATA{% else %}Clean All{% endif %}</strong>
                                </button>
                                <button class="button is-link" @click="showGenres = true">
                                    <strong>{% if ui_variant == 'v2' %}SELECT GENRES{% else %}Genres{% endif %}</strong>
                                </button>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </div>

        {% if ui_variant == 'v2' %}
        <section class="section pt-4 pb-3" v-if="!recommendationReady">
            <div class="container">
                <div class="v2-panel v2-hero">
                    <div class="pointer-events-none absolute -right-20 -top-20 h-64 w-64 rounded-full bg-[radial-gradient(circle,rgba(163,120,106,0.18),transparent_70%)]"></div>
                    <p class="v2-overline">Algorithm {{ ab_variant }}</p>
                    <h1 class="v2-title">Three-step setup for better movie recommendations</h1>
                    <p class="v2-copy">Start with genres, add ratings, then fine-tune with likes. You can always undo your latest action.</p>

                    <button class="button v2-btn v2-btn--primary is-medium" @click="startRecommendationFlow">START RECOMMENDATION</button>

                    <p class="v2-copy mt-2">
                        Completed: <strong class="text-neonCyan">[[ completedStepCount ]] / 3</strong>
                        | Selected genres: <strong class="text-neonCyan">[[ genres.length ]]</strong>
                        | Rated movies: <strong class="text-neonCyan">[[ userRates.length ]]</strong>
                        | Recommendation ready:
                        <strong :class="recommendationReady ? 'text-neonGreen' : 'text-neonPink'">[[ recommendationReady ? 'Yes' : 'No' ]]</strong>
                    </p>

                    <div class="v2-progress">
                        <div class="v2-progress-bar" :style="{ width: stepProgressPercent + '%' }"></div>
                    </div>

                    <div class="v2-stepper">
                        <article :class="['v2-step-card', stepOneDone ? 'is-complete' : '']">
                            <p class="v2-step-index">STEP 1</p>
                            <p class="v2-step-title">Choose Genres</p>
                            <p class="v2-step-meta">[[ genres.length ]] selected</p>
                        </article>
                        <article :class="['v2-step-card', stepTwoDone ? 'is-complete' : '']">
                            <p class="v2-step-index">STEP 2</p>
                            <p class="v2-step-title">Rate Movies</p>
                            <p class="v2-step-meta">[[ userRates.length ]] rated</p>
                        </article>
                        <article :class="['v2-step-card', stepThreeDone ? 'is-complete' : '']">
                            <p class="v2-step-index">STEP 3</p>
                            <p class="v2-step-title">Like Movies</p>
                            <p class="v2-step-meta">[[ userLikes.length ]] liked</p>
                        </article>
                    </div>

                    <div class="mt-5" v-if="selectedGenreLabels.length > 0">
                        <p class="v2-overline mb-2">Selected Genres</p>
                        <div class="flex flex-wrap gap-2">
                            <span class="v2-chip" v-for="genreName in selectedGenreLabels" :key="genreName">[[ genreName ]]</span>
                        </div>
                    </div>

                    <div class="v2-notice" v-if="actionNotice">
                        [[ actionNotice ]]
                    </div>
                </div>
            </div>
        </section>

        <div :class="['v2-control-backdrop', isControlPanelOpen ? 'is-active' : '']" @click="closeControlPanel"></div>

        <aside :class="['v2-control-center', isControlPanelOpen ? 'is-open' : '']" :aria-hidden="(!isControlPanelOpen).toString()">
            <div class="v2-control-head">
                <p class="v2-overline mb-0">Recommendation Controls</p>
                <button class="button v2-btn v2-panel-close" @click="closeControlPanel" aria-label="Close recommendation controls">
                    <span class="fa fa-times" aria-hidden="true"></span>
                </button>
            </div>
            <p class="text-sm text-tokenMuted mb-3">Use these actions anywhere on the page.</p>

            <div class="v2-control-summary" v-if="recommendationReady">
                <p class="v2-overline mb-1">Setup Status</p>
                <p class="v2-control-summary-title">Setup completed. Recommendations are active.</p>
            </div>

            <div class="v2-control-summary" v-if="selectedGenreLabels.length > 0">
                <p class="v2-overline mb-1">Selected Genres</p>
                <div class="v2-control-chip-row">
                    <span class="v2-chip" v-for="genreName in selectedGenreLabels" :key="'panel-' + genreName">[[ genreName ]]</span>
                </div>
            </div>

            <div class="v2-control-grid mb-3">
                <div class="v2-kpi">
                    <span>Genres</span>
                    <strong>[[ genres.length ]]</strong>
                </div>
                <div class="v2-kpi">
                    <span>Ratings</span>
                    <strong>[[ userRates.length ]]</strong>
                </div>
                <div class="v2-kpi">
                    <span>Likes</span>
                    <strong>[[ userLikes.length ]]</strong>
                </div>
                <div class="v2-kpi">
                    <span>Ready</span>
                    <strong :class="recommendationReady ? 'text-neonGreen' : 'text-neonPink'">[[ recommendationReady ? 'Yes' : 'No' ]]</strong>
                </div>
            </div>

            <button class="button v2-btn w-full mb-2" @click="showGenres = true; closeControlPanel()">Select Genres</button>
            <button class="button v2-btn w-full mb-2" @click="openRatingModal(); closeControlPanel()" :disabled="genres.length === 0">Rate Movies</button>
            <button class="button v2-btn v2-btn--danger w-full mb-2" @click="cleanAll(); closeControlPanel()">Clear Data</button>
            <a class="button v2-btn w-full" @click="closeControlPanel" href="/?variant={{ ab_variant }}{% if participant_id %}&participant_id={{ participant_id }}{% endif %}&ui=classic">Switch To Original UI</a>

            <p class="text-xs mt-3" :class="requiresRefresh ? 'text-neonPink' : 'text-tokenMuted'">
                [[ requiresRefresh ? 'Ratings are ready. Saving will auto-update recommendations.' : 'Likes and rating save actions update recommendations automatically.' ]]
            </p>
            <p class="text-xs mt-1 text-neonCyan" v-if="isSyncingFeedback">Applying your feedback and updating preference model...</p>
        </aside>
        {% endif %}

        <div id="recommendation-anchor" v-if="genres.length > 0 && userRates.length > 0"></div>
        <template v-if="genres.length > 0 && userRates.length > 0">
            <section class="section pt-2 pb-0 {% if ui_variant == 'v2' %}cyber-recommend-section{% endif %}" v-if="recommendationData.length > 0">
                <div class="container">
                    <p class="is-size-4 {% if ui_variant == 'v2' %}font-display uppercase tracking-[0.2em] text-white text-2xl font-bold{% endif %}">
                        {% if ui_variant == 'v2' %}RECOMMENDED MOVIES{% else %}Recommended{% endif %}
                    </p>
                    <p class="mb-5 {% if ui_variant == 'v2' %}text-neonCyan border-l-2 border-neonCyan pl-3 text-sm{% endif %}">[[ recommendationsMessage ]]</p>

                    <div class="columns is-mobile is-multiline">
                        <div class="column is-3-fullhd is-3-desktop is-3-tablet is-6-mobile" v-for="movie in recommendationData" :key="'rec-' + movie.movieId">
                            <div class="card {% if ui_variant == 'v2' %}border-l-4 border-r-0 border-y-0 border-l-neonPink bg-cyberGray shadow-[0_5px_15px_rgba(0,0,0,0.8)] transition-all duration-300 hover:border-l-neonCyan hover:shadow-[0_0_20px_rgba(0,240,255,0.4)] hover:-translate-y-2{% endif %}">
                                <div class="card-image relative">
                                    <figure class="image is-4by3">
                                        <img :src="movie.cover_url"
                                             onerror="this.src='https://placehold.co/480x640?text=No+Cover';"
                                             alt=""
                                             {% if ui_variant == 'v2' %}class="sepia blur-[1px] group-hover:blur-0 group-hover:sepia-0 transition-all mix-blend-luminosity hover:mix-blend-normal"{% endif %}>
                                    </figure>
                                    {% if ui_variant == 'v2' %}
                                    <div class="absolute inset-0 bg-gradient-to-t from-cyberBlack via-transparent to-transparent pointer-events-none"></div>
                                    {% endif %}
                                </div>
                                <div class="card-content p-3 {% if ui_variant == 'v2' %}bg-cyberBlack text-white border-t border-gray-800 relative{% endif %}">
                                    <div class="media">
                                        <div class="media-content">
                                            <p class="v2-title-safe {% if ui_variant == 'v2' %}font-display font-bold uppercase text-neonCyan mb-1 leading-tight tracking-[0.05em]{% else %}font-bold text-[0.8rem]{% endif %}">[[ movie.title ]]</p>
                                            <p class="{% if ui_variant == 'v2' %}text-[0.7rem] text-gray-500 font-body mb-2{% else %}text-[0.8rem]{% endif %}">[[ movie.release_date ]]</p>
                                            {% if ui_variant == 'v2' %}
                                            <div class="border-t border-dotted border-gray-700 pt-2 mt-2">
                                                <p class="font-display text-xs tracking-[0.2em] font-bold text-neonGreen" v-if="movieScore(movie.movieId)">MATCH: [[ (movieScore(movie.movieId) * 100).toFixed(1) ]]%</p>
                                                <div class="mt-2 flex flex-wrap gap-1" v-if="movieReasonTags(movie.movieId).length > 0">
                                                    <span class="v2-reason-chip border border-gray-800 bg-[rgba(163,120,106,0.12)] px-2 py-[2px] font-display text-[9px] uppercase tracking-[0.1em] text-neonPink" v-for="reason in movieReasonTags(movie.movieId)" :key="movie.movieId + '-' + reason">[[ reason ]]</span>
                                                </div>
                                            </div>
                                            {% endif %}
                                        </div>
                                    </div>
                                </div>

                                <div class="card-footer p-2 {% if ui_variant == 'v2' %}bg-cyberGray border-t border-neonPink{% endif %}">
                                    <div class="v2-feedback-row">
                                        <button class="button is-small {% if ui_variant == 'v2' %}v2-feedback-btn{% endif %}" @click="updateLike(movie.movieId)">
                                            <span :class="['fa fa-thumbs-up', inLikes(movie.movieId) ? '{% if ui_variant == 'v2' %}text-neonCyan{% else %}checked{% endif %}' : '']"> {% if ui_variant == 'v2' %}LIKE{% else %}Like{% endif %}</span>
                                        </button>
                                        <button class="button is-small {% if ui_variant == 'v2' %}v2-feedback-btn{% endif %}" @click="updateDislike(movie.movieId)">
                                            <span :class="['fa fa-thumbs-down', inDislikes(movie.movieId) ? '{% if ui_variant == 'v2' %}text-neonPink{% else %}checked{% endif %}' : '']"> {% if ui_variant == 'v2' %}DISLIKE{% else %}Dislike{% endif %}</span>
                                        </button>
                                        <button class="button is-small {% if ui_variant == 'v2' %}v2-feedback-btn{% endif %}" @click="updateNotInterested(movie.movieId)">
                                            <span :class="['fa fa-ban', inNotInterested(movie.movieId) ? '{% if ui_variant == 'v2' %}text-neonPink{% else %}checked{% endif %}' : '']"> {% if ui_variant == 'v2' %}NOT INTERESTED{% else %}Skip{% endif %}</span>
                                        </button>
                                        <button class="button is-small {% if ui_variant == 'v2' %}v2-feedback-btn{% endif %}" @click="openWhyModal(movie.movieId)">
                                            <span class="fa fa-question-circle"> {% if ui_variant == 'v2' %}WHY THIS?{% else %}Why?{% endif %}</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="section pb-0 {% if ui_variant == 'v2' %}cyber-similar-section{% endif %}" v-if="likesSimilarsData.length > 0">
                <div class="container">
                    <p class="is-size-4 {% if ui_variant == 'v2' %}font-display uppercase tracking-[0.2em] text-white text-xl font-bold{% endif %}">
                        {% if ui_variant == 'v2' %}BASED ON YOUR LIKES{% else %}Liked with Similar Items{% endif %}
                    </p>
                    <p class="mb-5 {% if ui_variant == 'v2' %}text-neonPink border-l-2 border-neonPink pl-3 text-sm{% endif %}">[[ likesSimilarMessage ]]</p>

                    <div class="columns is-mobile is-multiline">
                        <div class="column is-2-fullhd is-2-desktop is-2-tablet is-6-mobile" v-for="movie in likesSimilarsData" :key="'similar-' + movie.movieId">
                            <div class="card {% if ui_variant == 'v2' %}border-l-2 border-r-0 border-y-0 border-l-neonCyan bg-cyberGray shadow-[0_5px_15px_rgba(0,0,0,0.8)] transition-all duration-300 hover:border-l-neonGreen hover:shadow-[0_0_15px_rgba(0,255,63,0.4)] hover:-translate-y-1 opacity-80 hover:opacity-100{% endif %}">
                                <div class="card-image relative">
                                    <figure class="image is-3by4">
                                        <img :src="movie.cover_url"
                                             onerror="this.src='https://placehold.co/480x640?text=No+Cover';"
                                             alt=""
                                             {% if ui_variant == 'v2' %}class="grayscale hover:grayscale-0 transition-all"{% endif %}>
                                    </figure>
                                    {% if ui_variant == 'v2' %}
                                    <div class="absolute inset-0 bg-gradient-to-t from-cyberBlack via-transparent to-transparent pointer-events-none"></div>
                                    {% endif %}
                                </div>
                                <div class="card-content p-2 {% if ui_variant == 'v2' %}bg-cyberBlack text-white border-t border-gray-800{% endif %}">
                                    <div class="media">
                                        <div class="media-content">
                                            <p class="v2-title-safe {% if ui_variant == 'v2' %}font-display font-bold uppercase text-neonGreen mb-1 leading-tight text-[0.8rem] tracking-[0.05em]{% else %}font-bold text-[0.8rem]{% endif %}">[[ movie.title ]]</p>
                                            <p class="{% if ui_variant == 'v2' %}text-[0.65rem] text-gray-500 font-body{% else %}text-[0.8rem]{% endif %}">[[ movie.release_date ]]</p>
                                        </div>
                                    </div>
                                </div>

                                <div class="card-footer p-2 {% if ui_variant == 'v2' %}bg-cyberGray border-t border-neonCyan{% endif %}">
                                    <div class="v2-feedback-row">
                                        <button class="button is-small {% if ui_variant == 'v2' %}v2-feedback-btn{% endif %}" @click="updateLike(movie.movieId)">
                                            <span :class="['fa fa-thumbs-up', inLikes(movie.movieId) ? '{% if ui_variant == 'v2' %}text-neonGreen{% else %}checked{% endif %}' : '']"> {% if ui_variant == 'v2' %}LIKE{% else %}Like{% endif %}</span>
                                        </button>
                                        <button class="button is-small {% if ui_variant == 'v2' %}v2-feedback-btn{% endif %}" @click="updateDislike(movie.movieId)">
                                            <span :class="['fa fa-thumbs-down', inDislikes(movie.movieId) ? '{% if ui_variant == 'v2' %}text-neonPink{% else %}checked{% endif %}' : '']"> {% if ui_variant == 'v2' %}DISLIKE{% else %}Dislike{% endif %}</span>
                                        </button>
                                        <button class="button is-small {% if ui_variant == 'v2' %}v2-feedback-btn{% endif %}" @click="updateNotInterested(movie.movieId)">
                                            <span :class="['fa fa-ban', inNotInterested(movie.movieId) ? '{% if ui_variant == 'v2' %}text-neonPink{% else %}checked{% endif %}' : '']"> {% if ui_variant == 'v2' %}NOT INTERESTED{% else %}Skip{% endif %}</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="section pb-0 {% if ui_variant == 'v2' %}cyber-likes-section{% endif %}" v-if="likesData.length > 0">
                <div class="container">
                    <p class="is-size-4 mb-3 flex items-center gap-4 {% if ui_variant == 'v2' %}font-display uppercase tracking-[0.2em] text-white text-xl font-bold{% endif %}">
                        {% if ui_variant == 'v2' %}YOUR LIKES{% else %}Liked{% endif %}
                        <button class="button {% if ui_variant == 'v2' %}is-small bg-cyberBlack border border-neonGreen text-neonGreen hover:bg-neonGreen hover:text-black font-body uppercase tracking-wider{% endif %}" @click="reloadPage"><i class="fa fa-refresh mr-1" aria-hidden="true"></i>{% if ui_variant == 'v2' %}REFRESH{% else %}Refresh{% endif %}</button>
                    </p>

                    <div class="columns is-mobile pb-3" style="overflow-x: auto; overflow-y: hidden; flex-wrap: nowrap;">
                        <div class="column is-2-fullhd is-2-desktop is-3-tablet is-6-mobile" style="flex: 0 0 auto;" v-for="movie in likesData" :key="'like-' + movie.movieId">
                            <div class="card {% if ui_variant == 'v2' %}border-l-2 border-r-0 border-y-0 border-l-neonGreen bg-cyberGray shadow-[0_5px_15px_rgba(0,0,0,0.8)] transition-all duration-300 hover:border-l-white hover:shadow-[0_0_15px_rgba(255,255,255,0.4)] hover:-translate-y-1 opacity-70 hover:opacity-100{% endif %}">
                                <div class="card-image relative">
                                    <figure class="image is-3by4">
                                        <img :src="movie.cover_url"
                                             onerror="this.src='https://placehold.co/480x640?text=No+Cover';"
                                             alt=""
                                             {% if ui_variant == 'v2' %}class="hue-rotate-90 hover:hue-rotate-0 transition-all"{% endif %}>
                                    </figure>
                                    {% if ui_variant == 'v2' %}
                                    <div class="absolute inset-0 bg-gradient-to-t from-cyberBlack via-transparent to-transparent pointer-events-none"></div>
                                    {% endif %}
                                </div>
                                <div class="card-content p-2 {% if ui_variant == 'v2' %}bg-cyberBlack text-white border-t border-gray-800{% endif %}">
                                    <div class="media">
                                        <div class="media-content">
                                            <p class="v2-title-safe {% if ui_variant == 'v2' %}font-display font-bold uppercase text-white mb-1 leading-tight text-[0.8rem] tracking-[0.05em]{% else %}font-bold text-[0.8rem]{% endif %}">[[ movie.title ]]</p>
                                            <p class="{% if ui_variant == 'v2' %}text-[0.65rem] text-gray-500 font-body{% else %}text-[0.8rem]{% endif %}">[[ movie.release_date ]]</p>
                                        </div>
                                    </div>
                                </div>

                                <div class="card-footer p-2 {% if ui_variant == 'v2' %}bg-cyberGray border-t border-neonGreen{% endif %}">
                                    <div class="v2-feedback-row">
                                        <button class="button is-small {% if ui_variant == 'v2' %}v2-feedback-btn{% endif %}" @click="updateLike(movie.movieId)">

                <header class="modal-card-head {% if ui_variant == 'v2' %}bg-cyberBlack border-b border-gray-800{% endif %}">

<script id="recommendation-data" type="application/json">{{ recommendations | tojson }}</script>
<script id="likes-similars-data" type="application/json">{{ likes_similars | tojson }}</script>
<script id="likes-data" type="application/json">{{ likes | tojson }}</script>
<script id="genre-catalog-data" type="application/json">{{ genres | tojson }}</script>
<script id="selected-genres-data" type="application/json">{{ user_genres | tojson }}</script>
<script id="selected-rates-data" type="application/json">{{ user_rates | tojson }}</script>
<script id="selected-likes-data" type="application/json">{{ user_likes | tojson }}</script>
<script id="selected-dislikes-data" type="application/json">{{ user_dislikes | tojson }}</script>
<script id="selected-not-interested-data" type="application/json">{{ user_not_interested | tojson }}</script>
<script id="recommendations-message-data" type="application/json">{{ recommendations_message | tojson }}</script>
<script id="likes-similar-message-data" type="application/json">{{ likes_similar_message | tojson }}</script>
<script id="recommendation-explanations-data" type="application/json">{{ recommendation_explanations | tojson }}</script>
<script id="preference-dashboard-data" type="application/json">{{ preference_dashboard | tojson }}</script>
<script id="feedback-loop-data" type="application/json">{{ feedback_loop | tojson }}</script>
<script id="feedback-impact-data" type="application/json">{{ feedback_impact | tojson }}</script>
<script id="ab-variant-data" type="application/json">{{ ab_variant | tojson }}</script>
<script id="ui-variant-data" type="application/json">{{ ui_variant | tojson }}</script>

<script type="module">
    import {computed, createApp, onMounted, ref} from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

    function parseJsonScript(tagId, fallbackValue) {
        const target = document.getElementById(tagId)
        if (!target) {
            return fallbackValue
        }
        try {
            const parsed = JSON.parse(target.textContent || 'null')
            return parsed === null ? fallbackValue : parsed
        } catch (_error) {
            return fallbackValue
        }
    }

    const initialRecommendationData = parseJsonScript('recommendation-data', [])
    const initialLikesSimilarsData = parseJsonScript('likes-similars-data', [])
    const initialLikesData = parseJsonScript('likes-data', [])
    const initialRecommendationsMessage = parseJsonScript('recommendations-message-data', '')
    const initialLikesSimilarMessage = parseJsonScript('likes-similar-message-data', '')
    const genreCatalog = parseJsonScript('genre-catalog-data', [])
    const initialSelectedGenres = parseJsonScript('selected-genres-data', [])
    const initialSelectedRates = parseJsonScript('selected-rates-data', [])
    const initialSelectedLikes = parseJsonScript('selected-likes-data', [])
    const initialSelectedDislikes = parseJsonScript('selected-dislikes-data', [])
    const initialSelectedNotInterested = parseJsonScript('selected-not-interested-data', [])
    const initialRecommendationExplanations = parseJsonScript('recommendation-explanations-data', {})
    const initialPreferenceDashboard = parseJsonScript('preference-dashboard-data', {})
    const initialFeedbackLoop = parseJsonScript('feedback-loop-data', {})
    const initialFeedbackImpact = parseJsonScript('feedback-impact-data', {})
    const abVariant = parseJsonScript('ab-variant-data', 'A')
    const uiVariant = parseJsonScript('ui-variant-data', 'classic')

    let app = createApp({
        setup() {
            const isLoading = ref(true)
            const isActivityNavBar = ref(false)

            const showGenres = ref(false)
            const genres = ref(initialSelectedGenres)

            const showMovieRate = ref(false)
            const userRates = ref(initialSelectedRates)
            const userLikes = ref(initialSelectedLikes)
            const userDislikes = ref(initialSelectedDislikes)
            const userNotInterested = ref(initialSelectedNotInterested)

            const recommendationData = ref(initialRecommendationData)
            const likesSimilarsData = ref(initialLikesSimilarsData)
            const likesData = ref(initialLikesData)
            const recommendationsMessage = ref(initialRecommendationsMessage)
            const likesSimilarMessage = ref(initialLikesSimilarMessage)

            const recommendationExplanations = ref(initialRecommendationExplanations)
            const preferenceDashboard = ref(initialPreferenceDashboard)
            const feedbackLoop = ref(initialFeedbackLoop)
            const feedbackImpact = ref(initialFeedbackImpact)

            const showWhyModal = ref(false)
            const activeWhyMovieId = ref('')
            const isSyncingFeedback = ref(false)

            const actionHistory = ref([])
            const actionNotice = ref('')
            const requiresRefresh = ref(false)
            const isControlPanelOpen = ref(false)

            const stepOneDone = computed(() => genres.value.length > 0)
            const stepTwoDone = computed(() => userRates.value.length > 0)
            const stepThreeDone = computed(() => userLikes.value.length > 0)
            const completedStepCount = computed(() => {
                return [stepOneDone.value, stepTwoDone.value, stepThreeDone.value].filter(Boolean).length
            })
            const stepProgressPercent = computed(() => Math.round((completedStepCount.value / 3) * 100))
            const recommendationReady = computed(() => stepOneDone.value && stepTwoDone.value)
            const canUndo = computed(() => actionHistory.value.length > 0)
            const selectedGenreLabels = computed(() => {
                const selected = new Set(genres.value.map((genreId) => genreId.toString()))
                return genreCatalog
                    .filter((genreItem) => selected.has(genreItem.id.toString()))
                    .map((genreItem) => genreItem.name)
            })
            const dashboardSummary = computed(() => preferenceDashboard.value.summary || {})
            const dashboardGenres = computed(() => preferenceDashboard.value.genre_preferences || [])
            const dashboardSuppressedGenres = computed(() => preferenceDashboard.value.suppressed_genres || [])
            const dashboardPreferredPeople = computed(() => {
                const actors = (preferenceDashboard.value.preferred_actors || []).map((item) => ({...item, role: 'actor'}))
                const directors = (preferenceDashboard.value.preferred_directors || []).map((item) => ({...item, role: 'director'}))
                return [...actors, ...directors].slice(0, 8)
            })
            const activeWhyExplanation = computed(() => {
                if (!activeWhyMovieId.value) {
                    return null
                }
                const key = activeWhyMovieId.value.toString()
                return recommendationExplanations.value[key] || null
            })

            let noticeTimer = null
            let ratingSyncTimer = null

            // ==== Vue default operations ====
            onMounted(() => {
                isLoading.value = false
                showGenres.value = genres.value.length === 0
                showMovieRate.value = genres.value.length > 0 && userRates.value.length === 0
            })

            function setNotice(message) {
                actionNotice.value = message
                if (noticeTimer) {
                    window.clearTimeout(noticeTimer)
                }
                noticeTimer = window.setTimeout(() => {
                    actionNotice.value = ''
                }, 2800)
            }

            function toggleControlPanel() {
                isControlPanelOpen.value = !isControlPanelOpen.value
            }

            function closeControlPanel() {
                isControlPanelOpen.value = false
            }

            function writeCookieArray(cookieName, values) {
                if (values.length === 0) {
                    document.cookie = cookieName + '=; Max-Age=0; path=/'
                    return
                }
                document.cookie = cookieName + '=' + values.join(',') + '; path=/'
            }

            function persistUserState() {
                writeCookieArray('user_genres', genres.value)
                writeCookieArray('user_rates', userRates.value)
                writeCookieArray('user_likes', userLikes.value)
                writeCookieArray('user_dislikes', userDislikes.value)
                writeCookieArray('user_not_interested', userNotInterested.value)
            }

            function snapshotState() {
                return {
                    genres: [...genres.value],
                    userRates: [...userRates.value],
                    userLikes: [...userLikes.value],
                    userDislikes: [...userDislikes.value],
                    userNotInterested: [...userNotInterested.value],
                    requiresRefresh: requiresRefresh.value,
                }
            }

            function pushHistory(actionLabel) {
                actionHistory.value.push({label: actionLabel, state: snapshotState()})
                if (actionHistory.value.length > 40) {
                    actionHistory.value.shift()
                }
            }

            function undoLastOperation() {
                if (actionHistory.value.length === 0) {
                    setNotice('No action to undo.')
                    return
                }
                const lastAction = actionHistory.value.pop()
                genres.value = [...lastAction.state.genres]
                userRates.value = [...lastAction.state.userRates]
                userLikes.value = [...lastAction.state.userLikes]
                userDislikes.value = [...(lastAction.state.userDislikes || [])]
                userNotInterested.value = [...(lastAction.state.userNotInterested || [])]
                requiresRefresh.value = Boolean(lastAction.state.requiresRefresh)
                persistUserState()
                setNotice('Undo: ' + lastAction.label)
            }

            function cleanAll() {
                if (!confirm('Are you sure to delete all records?')) {
                    return
                }
                pushHistory('Clear all data')
                genres.value = []
                userRates.value = []
                userLikes.value = []
                userDislikes.value = []
                userNotInterested.value = []
                requiresRefresh.value = false
                persistUserState()

                if (uiVariant === 'v2') {
                    showGenres.value = true
                    showMovieRate.value = false
                    setNotice('All records are cleared.')
                    return
                }
                reloadPage()
            }

            // ==== Genre Operation ====
            function updateGenre(_id) {
                pushHistory('Update selected genres')
                const id = _id.toString()
                const index = genres.value.indexOf(id)
                if (index > -1) {
                    genres.value.splice(index, 1)
                } else {
                    genres.value.push(id)
                    genres.value = genres.value.sort((a, b) => Number(a) - Number(b))
                }
            }

            function inGenres(id) {
                return genres.value.includes(id.toString())
            }

            function saveGenres() {
                pushHistory('Save genres')
                persistUserState()

                if (uiVariant === 'v2') {
                    showGenres.value = false
                    if (userRates.value.length === 0) {
                        requiresRefresh.value = true
                        showMovieRate.value = true
                        setNotice('Genres saved. Next step: rate movies.')
                        return
                    }
                    requiresRefresh.value = false
                    syncRecommendationState({type: 'genre_save'})
                    return
                }
                reloadPage()
            }

            // ==== Movie Rate Operation ====
            function getRate(movieId) {
                for (let index in userRates.value) {
                    const record = userRates.value[index].split('|')
                    if (parseInt(record[1], 10) === movieId) {
                        return [index, Number(record[2])]
                    }
                }
                return [-1, -1]
            }

            function updateRate(movieId, rate) {
                pushHistory('Rate movie')
                const record = '611|' + movieId + '|' + rate + '|0'
                const index = getRate(movieId)[0]
                if (index > -1) {
                    userRates.value[index] = record
                } else {
                    userRates.value.push(record)
                }
                writeCookieArray('user_rates', userRates.value)
                requiresRefresh.value = true
                if (uiVariant === 'v2') {
                    requiresRefresh.value = false
                    setNotice('Rating updated. Recommendation lists are refreshing.')
                    if (ratingSyncTimer) {
                        window.clearTimeout(ratingSyncTimer)
                    }
                    ratingSyncTimer = window.setTimeout(() => {
                        syncRecommendationState({type: 'rating_save'})
                    }, 220)
                }
            }

            function saveRatings() {
                showMovieRate.value = false
                if (uiVariant === 'v2') {
                    if (ratingSyncTimer) {
                        window.clearTimeout(ratingSyncTimer)
                        ratingSyncTimer = null
                    }
                    requiresRefresh.value = false
                    syncRecommendationState({type: 'rating_save'})
                    return
                }
                reloadPage()
            }

            function openRatingModal() {
                if (genres.value.length === 0) {
                    showGenres.value = true
                    setNotice('Choose genres before rating movies.')
                    return
                }
                showMovieRate.value = true
            }

            function removeFromBucket(bucket, movieId) {
                const index = bucket.indexOf(movieId)
                if (index > -1) {
                    bucket.splice(index, 1)
                }
            }

            function syncRecommendationState(feedbackEvent = null) {
                if (uiVariant !== 'v2') {
                    return
                }
                isSyncingFeedback.value = true
                fetch('/api/recommendation-state', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        variant: abVariant,
                        user_genres: genres.value,
                        user_rates: userRates.value,
                        user_likes: userLikes.value,
                        user_dislikes: userDislikes.value,
                        user_not_interested: userNotInterested.value,
                        feedback_event: feedbackEvent,
                    }),
                })
                    .then((response) => {
                        if (!response.ok) {
                            throw new Error('state sync failed')
                        }
                        return response.json()
                    })
                    .then((state) => {
                        recommendationData.value = state.recommendations || recommendationData.value
                        likesSimilarsData.value = state.likes_similars || likesSimilarsData.value
                        likesData.value = state.likes || likesData.value
                        recommendationsMessage.value = state.recommendations_message || recommendationsMessage.value
                        likesSimilarMessage.value = state.likes_similar_message || likesSimilarMessage.value
                        recommendationExplanations.value = state.recommendation_explanations || recommendationExplanations.value
                        preferenceDashboard.value = state.preference_dashboard || preferenceDashboard.value
                        feedbackLoop.value = state.feedback_loop || feedbackLoop.value
                        feedbackImpact.value = state.feedback_impact || feedbackImpact.value
                        if (feedbackImpact.value && feedbackImpact.value.message) {
                            setNotice(feedbackImpact.value.message)
                        }
                    })
                    .catch(() => {
                        setNotice('Unable to sync feedback state. Please refresh the page.')
                    })
                    .finally(() => {
                        isSyncingFeedback.value = false
                    })
            }

            function applyFeedback(movieId, feedbackType) {
                const movieKey = movieId.toString()
                pushHistory('Feedback: ' + feedbackType)

                const alreadyLiked = userLikes.value.includes(movieKey)
                const alreadyDisliked = userDislikes.value.includes(movieKey)
                const alreadyNotInterested = userNotInterested.value.includes(movieKey)

                removeFromBucket(userLikes.value, movieKey)
                removeFromBucket(userDislikes.value, movieKey)
                removeFromBucket(userNotInterested.value, movieKey)

                if (feedbackType === 'like' && !alreadyLiked) {
                    userLikes.value.push(movieKey)
                }
                if (feedbackType === 'dislike' && !alreadyDisliked) {
                    userDislikes.value.push(movieKey)
                }
                if (feedbackType === 'not_interested' && !alreadyNotInterested) {
                    userNotInterested.value.push(movieKey)
                }

                requiresRefresh.value = false
                persistUserState()
                syncRecommendationState({type: feedbackType, movieId: Number(movieId)})

                if (uiVariant !== 'v2') {
                    reloadPage()
                }
            }

            // ==== Movie Feedback Operation ====
            function updateLike(movieId) {
                applyFeedback(movieId, 'like')
            }

            function updateDislike(movieId) {
                applyFeedback(movieId, 'dislike')
            }

            function updateNotInterested(movieId) {
                applyFeedback(movieId, 'not_interested')
            }

            function inLikes(movieId) {
                return userLikes.value.includes(movieId.toString())
            }

            function inDislikes(movieId) {
                return userDislikes.value.includes(movieId.toString())
            }

            function inNotInterested(movieId) {
                return userNotInterested.value.includes(movieId.toString())
            }

            function movieScore(movieId) {
                const movie = recommendationData.value.find((entry) => entry.movieId === movieId)
                if (!movie) {
                    return ''
                }
                if (typeof movie.final_score === 'number') {
                    return movie.final_score.toFixed(3)
                }
                if (typeof movie.similarity === 'number') {
                    return movie.similarity.toFixed(3)
                }
                return ''
            }

            function movieReasonTags(movieId) {
                const explanation = recommendationExplanations.value[movieId.toString()]
                if (explanation && Array.isArray(explanation.details) && explanation.details.length > 0) {
                    return explanation.details.slice(0, 3)
                }

                const movie = recommendationData.value.find((entry) => entry.movieId === movieId)
                if (!movie) {
                    return []
                }

                const tags = []
                if (typeof movie.final_score === 'number') {
                    tags.push('Hybrid ranking')
                    tags.push('Temporal rating fit')
                }
                if (typeof movie.similarity === 'number') {
                    tags.push('Semantic proximity')
                }
                if (tags.length === 0) {
                    tags.push('Preference match')
                }
                return tags
            }

            function openWhyModal(movieId) {
                activeWhyMovieId.value = movieId.toString()
                showWhyModal.value = true
            }

            function closeWhyModal() {
                showWhyModal.value = false
                activeWhyMovieId.value = ''
            }

            function scrollToSection(sectionId) {
                const target = document.getElementById(sectionId)
                if (target) {
                    target.scrollIntoView({behavior: 'smooth', block: 'start'})
                    return
                }
                setNotice('This section appears after recommendations are ready.')
            }

            function startRecommendationFlow() {
                if (genres.value.length === 0) {
                    showGenres.value = true
                    return
                }
                if (userRates.value.length === 0) {
                    showMovieRate.value = true
                    return
                }

                const recommendationAnchor = document.getElementById('recommendation-anchor')
                if (recommendationAnchor) {
                    recommendationAnchor.scrollIntoView({behavior: 'smooth', block: 'start'})
                    return
                }
                setNotice('Recommendations update automatically after rating and like actions.')
            }

            function reloadPage() {
                location.reload()
            }

            return {
                isLoading,
                isActivityNavBar,
                cleanAll,

                showGenres,
                genres,
                updateGenre,
                inGenres,
                saveGenres,

                showMovieRate,
                userRates,
                getRate,
                updateRate,
                saveRatings,
                openRatingModal,

                userLikes,
                userDislikes,
                userNotInterested,
                updateLike,
                updateDislike,
                updateNotInterested,
                inLikes,
                inDislikes,
                inNotInterested,
                movieScore,
                movieReasonTags,
                openWhyModal,
                closeWhyModal,
                scrollToSection,
                showWhyModal,
                activeWhyExplanation,

                recommendationData,
                likesSimilarsData,
                likesData,
                recommendationsMessage,
                likesSimilarMessage,
                recommendationExplanations,
                preferenceDashboard,
                feedbackLoop,
                feedbackImpact,
                dashboardSummary,
                dashboardGenres,
                dashboardSuppressedGenres,
                dashboardPreferredPeople,
                isSyncingFeedback,

                stepOneDone,
                stepTwoDone,
                stepThreeDone,
                completedStepCount,
                stepProgressPercent,
                recommendationReady,
                selectedGenreLabels,
                canUndo,
                undoLastOperation,
                actionNotice,
                requiresRefresh,
                isControlPanelOpen,
                toggleControlPanel,
                closeControlPanel,
                startRecommendationFlow,

                reloadPage,
            }
        }
    })

    // Reset the Vue delimiters and Mount it
    app.config.compilerOptions.delimiters = ['[[', ']]']
    app.mount('#app')

</script>
